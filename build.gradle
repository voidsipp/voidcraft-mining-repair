plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = '1.0.3'
group = 'net.voidcraft.wandcompat'
base { archivesName = 'voidcraft-wand-compat-26.1.2' }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
repositories { mavenCentral() }
neoForge {
    version = '26.1.2.121'
    mods { voidcraft_wand_compat { sourceSet(sourceSets.main) } }
}
dependencies {
    compileOnly files('libs/ftb-ultimine-neoforge-26.1.2.5.jar')
    compileOnly files('libs/ftb-library-neoforge-26.1.2.9.jar')
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}
tasks.named('test') { useJUnitPlatform() }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
